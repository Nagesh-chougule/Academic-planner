<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Department Academic Planner — NEP 2020 (Maharashtra)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --paper: #f7f5ee;
      --blue: #1d4e6b;
      --blue-deep: #0f3247;
      --blue-pale: #e4ecf0;
      --grid: rgba(29, 78, 107, 0.10);
      --orange: #d9622b;
      --orange-pale: #faeadf;
      --green: #3f7d58;
      --green-pale: #e6f0e9;
      --red: #b23a3a;
      --red-pale: #f6e5e3;
      --purple: #5b4b8a;
      --purple-pale: #ece8f5;
      --ink: #1c232b;
      --ink-soft: #5b6472;
      --line: #d8d0bd;
      --white: #fffdf8;
      --shadow: 0 1px 2px rgba(15, 50, 71, .06), 0 8px 22px rgba(15, 50, 71, .08);
      --radius: 9px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--paper);
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 272px;
      flex-shrink: 0;
      background: var(--blue-deep);
      color: #e7edf1;
      padding: 24px 0 20px;
      position: relative;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px 18px;
      border-bottom: 1px solid rgba(231, 237, 241, .14);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border: 2px solid var(--orange);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-3deg);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 10px;
      color: var(--orange);
      flex-shrink: 0;
      text-align: center;
      line-height: 1.1;
    }

    .brand-text .k {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2;
    }

    .brand-text .s {
      font-size: 9.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #9db2c1;
      margin-top: 2px;
    }

    nav.idx {
      padding: 10px 10px;
    }

    .idx-item {
      display: flex;
      align-items: baseline;
      gap: 9px;
      width: 100%;
      text-align: left;
      border: none;
      background: none;
      cursor: pointer;
      color: #c9d6de;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 1px;
      font-family: 'Inter';
    }

    .idx-item .no {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #6f8798;
      width: 18px;
      flex-shrink: 0;
    }

    .idx-item:hover {
      background: rgba(231, 237, 241, .08);
      color: #fff;
    }

    .idx-item.active {
      background: var(--orange);
      color: #fff;
      font-weight: 600;
    }

    .idx-item.active .no {
      color: #fff;
      opacity: .75;
    }

    .idx-divider {
      margin: 12px 20px 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #6f8798;
    }

    .sidebar-foot {
      padding: 14px 22px 0;
      margin-top: 6px;
      border-top: 1px solid rgba(231, 237, 241, .14);
      font-size: 10px;
      color: #7e94a2;
      line-height: 1.6;
    }

    main {
      flex: 1;
      min-width: 0;
      padding: 34px 42px 70px;
      max-width: 1220px;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .eyebrow::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    h1.page-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 30px;
      margin: 0 0 6px;
      color: var(--blue-deep);
      letter-spacing: -.01em;
    }

    .page-sub {
      color: var(--ink-soft);
      font-size: 13.5px;
      max-width: 700px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      position: relative;
    }

    .card.tick::before,
    .card.tick::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--blue);
      border-style: solid;
      top: 8px;
    }

    .card.tick::before {
      left: 8px;
      border-width: 2px 0 0 2px;
    }

    .card.tick::after {
      right: 8px;
      border-width: 2px 2px 0 0;
    }

    .card h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16.5px;
      margin: 0 0 4px;
      color: var(--blue-deep);
    }

    .card p.desc {
      color: var(--ink-soft);
      font-size: 13px;
      margin: 0 0 12px;
      line-height: 1.5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    th {
      text-align: left;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--ink-soft);
      padding: 7px 8px;
      border-bottom: 2px solid var(--blue);
    }

    td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tfoot td {
      font-weight: 700;
      border-top: 2px solid var(--blue);
      border-bottom: none;
      font-family: 'IBM Plex Mono', monospace;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      background: var(--blue-pale);
      color: var(--blue-deep);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: .02em;
    }

    .tag.purple {
      background: var(--purple-pale);
      color: var(--purple);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .status.ok {
      background: var(--green-pale);
      color: var(--green);
    }

    .status.warn {
      background: var(--orange-pale);
      color: var(--orange);
    }

    .status.bad {
      background: var(--red-pale);
      color: var(--red);
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--blue-deep);
      margin-bottom: 5px;
    }

    input[type=text],
    input[type=number],
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: 'Inter';
      font-size: 13px;
      background: var(--white);
      color: var(--ink);
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--orange);
      outline-offset: 1px;
      border-color: var(--orange);
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    .row4 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 14px;
    }

    button.primary {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 9px 17px;
      border-radius: 7px;
      font-family: 'Inter';
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }

    button.primary:hover {
      background: var(--blue-deep);
    }

    button.ghost {
      background: none;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Inter';
      font-weight: 600;
    }

    button.ghost:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    button.ghost.active {
      border-color: var(--blue);
      color: var(--blue);
      background: var(--blue-pale);
    }

    button.danger {
      background: none;
      border: 1px solid var(--red-pale);
      color: var(--red);
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 10.5px;
      cursor: pointer;
      font-family: 'Inter';
      font-weight: 600;
    }

    button.chip-x {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-weight: 700;
      margin-left: 4px;
      padding: 0 2px;
    }

    .add-row {
      display: grid;
      grid-template-columns: 1.2fr 2fr 1.3fr .5fr .5fr .5fr .7fr auto;
      gap: 8px;
      align-items: end;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .add-row .field {
      margin-bottom: 0;
    }

    .sem-tabs,
    .prog-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .sem-tab {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--ink-soft);
      cursor: pointer;
    }

    .sem-tab.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .sem-tab .c {
      opacity: .75;
      margin-left: 4px;
    }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 15px 17px;
      box-shadow: var(--shadow);
    }

    .stat .n {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: var(--blue-deep);
    }

    .stat .l {
      font-size: 11px;
      color: var(--ink-soft);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .meter {
      height: 7px;
      border-radius: 99px;
      background: var(--blue-pale);
      overflow: hidden;
      margin-top: 7px;
    }

    .meter>div {
      height: 100%;
      background: var(--blue);
    }

    .meter.bad>div {
      background: var(--red);
    }

    .meter.warn>div {
      background: var(--orange);
    }

    .empty {
      text-align: center;
      padding: 30px 18px;
      color: var(--ink-soft);
      font-size: 13px;
      border: 1.5px dashed var(--line);
      border-radius: var(--radius);
      background: var(--blue-pale);
    }

    .roles-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .roles-list li {
      padding: 5px 0 5px 18px;
      position: relative;
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
    }

    .roles-list li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--orange);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--blue-pale);
      color: var(--blue-deep);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 600;
      margin: 2px 4px 2px 0;
    }

    .titleblock {
      border: 2px solid var(--blue-deep);
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 22px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      background: var(--white);
    }

    .titleblock div span.l {
      display: block;
      color: var(--ink-soft);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 2px;
    }

    .titleblock div span.v {
      font-weight: 700;
      color: var(--blue-deep);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .selectbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 18px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .selectbar .field {
      margin-bottom: 0;
      min-width: 170px;
    }

    /* Sync status toast (Google Sheets backend) */
    .sync-toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 999;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 7px;
      box-shadow: var(--shadow);
      color: #fff;
      max-width: 360px;
      line-height: 1.4;
      transition: opacity .15s ease;
    }

    .sync-toast.loading {
      background: var(--blue);
    }

    .sync-toast.saving {
      background: var(--blue-deep);
    }

    .sync-toast.ok {
      background: var(--green);
    }

    .sync-toast.error {
      background: var(--red);
    }

    /* Timetable grid */
    .tt-wrap {
      overflow-x: auto;
    }

    table.tt {
      border-collapse: collapse;
      width: 100%;
      min-width: 760px;
    }

    table.tt th,
    table.tt td {
      border: 1px solid var(--line);
      text-align: center;
      padding: 0;
      font-size: 11.5px;
    }

    table.tt th {
      background: var(--blue-pale);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 7px 4px;
      color: var(--blue-deep);
    }

    table.tt td.period-lbl {
      background: var(--blue-pale);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      padding: 6px 8px;
      color: var(--blue-deep);
      white-space: nowrap;
    }

    .tt-cell {
      width: 120px;
      height: 56px;
      cursor: pointer;
      padding: 4px 5px;
      vertical-align: middle;
    }

    .tt-cell:hover {
      background: var(--orange-pale);
    }

    .tt-cell.filled {
      background: var(--green-pale);
    }

    .tt-cell.selected {
      outline: 2px solid var(--orange);
      outline-offset: -2px;
    }

    .tt-cell.clash {
      background: var(--red-pale);
    }

    .tt-code {
      font-weight: 700;
      color: var(--blue-deep);
      font-size: 11.5px;
    }

    .tt-fac {
      font-size: 10px;
      color: var(--ink-soft);
    }

    .tt-room {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px;
      color: var(--ink-soft);
    }

    @media print {

      .sidebar,
      .toolbar,
      .add-row,
      .no-print,
      .selectbar {
        display: none !important;
      }

      main {
        padding: 0;
        max-width: 100%;
      }

      body {
        background: #fff;
      }
    }

    @media (max-width: 940px) {
      #root {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      nav.idx {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      main {
        padding: 22px 14px 60px;
      }

      .row2,
      .row3,
      .row4 {
        grid-template-columns: 1fr;
      }

      .add-row {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">DEPT<br>PLAN</div>
        <div class="brand-text">
          <div class="k">Academic Planner</div>
          <div class="s">NEP 2020 · Maharashtra</div>
        </div>
      </div>
      <div class="idx-divider">Reference</div>
      <nav class="idx" id="nav-ref"></nav>
      <div class="idx-divider">Department</div>
      <nav class="idx" id="nav-dept"></nav>
      <div class="idx-divider">Curriculum</div>
      <nav class="idx" id="nav-curr"></nav>
      <div class="idx-divider">Faculty Load</div>
      <nav class="idx" id="nav-load"></nav>
      <div class="idx-divider">Timetable</div>
      <nav class="idx" id="nav-tt"></nav>
      <div class="idx-divider">Output</div>
      <nav class="idx" id="nav-out"></nav>
      <div class="idx-divider">Data Exchange</div>
      <nav class="idx" id="nav-data"></nav>
      <div class="sidebar-foot">Credit framework per Govt. of Maharashtra GR (4 Jul &amp; 3 Aug 2023), DTE/SPPU NEP 2020
        structure.</div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="sync-toast" class="sync-toast" style="display:none;"></div>

  <script>
    /* ============================= FRAMEWORK DATA ============================= */
    const CATEGORIES = [
      { code: "BSC", name: "Basic Science Course", min: 14, max: 18, note: "Maths, Physics, Chemistry — Sem I–II mainly." },
      { code: "ESC", name: "Engineering Science Course", min: 12, max: 16, note: "Basic Electrical/Electronics, Mechanics, Graphics, Programming — Sem I–II." },
      { code: "PCC", name: "Programme Core Course", min: 44, max: 56, note: "Mandatory major-discipline courses, all four years." },
      { code: "PEC", name: "Programme Elective Course", min: 20, max: 20, note: "Major electives, offered from Sem V onward." },
      { code: "MDM", name: "Multidisciplinary Minor", min: 14, max: 14, note: "Compulsory minor from another discipline/faculty, Sem II–VIII." },
      { code: "OE", name: "Open Elective", min: 8, max: 8, note: "Chosen compulsorily from a faculty other than the Major — Sem III–V." },
      { code: "VSEC", name: "Vocational & Skill Enhancement", min: 8, max: 8, note: "VSC (4 Cr., hands-on) + SEC (4 Cr.) — first three years." },
      { code: "AEC", name: "Ability Enhancement Course", min: 4, max: 4, note: "English (2 Cr.) + Modern Indian Language (2 Cr.) — Sem I–II." },
      { code: "IKS", name: "Indian Knowledge System", min: 2, max: 2, note: "Sem I, from the approved IKS basket." },
      { code: "VEC", name: "Value Education Course", min: 4, max: 4, note: "Sem III–IV." },
      { code: "RM", name: "Research Methodology / Experiential Learning", min: 4, max: 4, note: "Typically Sem VII." },
      { code: "CEP_FP", name: "Community Engagement / Field Project", min: 2, max: 2, note: "Minimum 2 Cr., Sem III (2nd year)." },
      { code: "PRJ", name: "Project", min: 4, max: 4, note: "Major project, Sem VII–VIII." },
      { code: "INT", name: "Internship / OJT", min: 12, max: 12, note: "One full semester, VII or VIII, 1 Cr. per 2 weeks (36–40 hrs)." },
      { code: "CC", name: "Co-Curricular Course", min: 4, max: 4, note: "Health & Wellness, Yoga, Sports, NSS/NCC, Arts — Sem I–II." },
    ];
    const SUM_MIN = CATEGORIES.reduce((s, c) => s + c.min, 0);
    const SUM_MAX = CATEGORIES.reduce((s, c) => s + c.max, 0);

    /* ---- PG category tables (illustrative — Maharashtra has published overall PG credit
       ranges and a research-project weightage, but not yet a granular per-category table
       as detailed as the UG SPPU booklet. Confirm exact split with the affiliating
       university's approved PG scheme before finalising.) ---- */
    const PG2_CATEGORIES = [
      { code: "PCC_PG", name: "Programme Core Course", min: 24, max: 30, note: "Core specialization courses — Sem I–II mainly." },
      { code: "PEC_PG", name: "Programme Elective Course", min: 16, max: 20, note: "Specialization electives — Sem I–III." },
      { code: "OE_PG", name: "Open Elective / MOOC", min: 4, max: 4, note: "Cross-disciplinary or SWAYAM/MOOC elective — Sem II." },
      { code: "RM", name: "Research Methodology & IPR", min: 4, max: 4, note: "Sem I." },
      { code: "SEM_PG", name: "Seminar", min: 2, max: 2, note: "Sem II or III." },
      { code: "MP_PG", name: "Mini Project / Audit Course", min: 4, max: 4, note: "Sem II." },

    /* ============================= FRONTEND API LAYER ============================= */
    /**
     * Low-level request helper. GET requests are sent as query params (cacheable,
     * no body). POST requests are sent with a text/plain body (JSON-encoded) —
     * this deliberately avoids the application/json content-type so the browser
     * treats it as a "simple request" and skips the CORS preflight that Apps
     * Script web apps cannot answer.
     */
    async function apiRequest(method, params, body) {
      if (!APP_CONFIG.API_URL || APP_CONFIG.API_URL.indexOf("PASTE_YOUR") === 0) {
        throw new Error("Apps Script Web App URL is not configured yet (APP_CONFIG.API_URL).");
      }
      let url = APP_CONFIG.API_URL;
      if (params) {
        const qs = new URLSearchParams(params).toString();
        url += (url.indexOf("?") === -1 ? "?" : "&") + qs;
      }
      const opts = { method };
      if (method === "POST") {
        opts.headers = { "Content-Type": "text/plain;charset=utf-8" };
        opts.body = JSON.stringify(body || {});
      }
      let res;
      try {
        res = await fetch(url, opts);
      } catch (networkErr) {
        throw new Error("Network Error — could not reach Google Sheets backend.");
      }
      if (!res.ok) {
        throw new Error("Google Sheets Error (HTTP " + res.status + ")");
      }
      let json;
      try { json = await res.json(); }
      catch (parseErr) { throw new Error("Google Sheets Error — invalid response."); }
      if (!json.ok) {
        throw new Error(json.error || "Google Sheets Error");
      }
      return json.data;
    }
    async function apiLoadAll() { return apiRequest("GET", { action: "getAll" }); }
    async function apiSave(fullState) { return apiRequest("POST", null, { action: "saveAll", data: fullState }); }
    async function apiGet(sheet, id) { return apiRequest("GET", { action: "getRecord", sheet, id }); }
    async function apiSearch(sheet, field, value) { return apiRequest("GET", { action: "searchRecords", sheet, field, value }); }
    async function apiCreate(sheet, record) { return apiRequest("POST", null, { action: "createRecord", sheet, record }); }

    /* ============================= FLATTEN / INFLATE ============================= */
    /**
     * The planner's in-memory model nests courses inside programs and
     * assignments inside courses. Google Sheets is flat, so every load/save
     * flattens to six row-arrays (mirroring the existing Excel import/export
     * shape in this app) and inflates back to the nested shape the UI expects.
     */
    function flattenState() {
      const departmentRows = [{ id: "dept", name: DEPARTMENT.name || "" }];

      const programRows = PROGRAMS.map(p => ({
        id: p.id, name: p.name, type: p.type, major: p.major, minor: p.minor,
        totalTarget: p.totalTarget, semMin: p.semMin, semMax: p.semMax, semesters: p.semesters
      }));

      const courseRows = [];
      const assignRows = [];
      PROGRAMS.forEach(p => (p.courses || []).forEach(c => {
        courseRows.push({ id: c.id, programId: p.id, programName: p.name, sem: c.sem, code: c.code, title: c.title, category: c.category, L: c.L, T: c.T, P: c.P, credits: c.credits });
        (c.assignments || []).forEach(a => {
          assignRows.push({ id: a.id || uid(), courseId: c.id, programName: p.name, sem: c.sem, code: c.code, facultyId: a.facultyId, facultyName: facultyName(a.facultyId), hours: a.hours });
        });
      }));

      const facultyRows = FACULTY.map(f => ({ id: f.id, name: f.name, designation: f.designation, specialization: f.specialization, maxLoad: f.maxLoad }));

      const ttRows = TIMETABLE.map(t => {
        const p = getProgram(t.programId);
        return { id: t.id, programId: t.programId, programName: p ? p.name : "", semester: t.semester, division: t.division, day: t.day, period: t.period, courseId: t.courseId, code: t.code, facultyId: t.facultyId, facultyName: facultyName(t.facultyId), room: t.room };
      });

      return { department: departmentRows, programs: programRows, courses: courseRows, faculty: facultyRows, assignments: assignRows, timetable: ttRows };
    }

    function inflateState(data) {
      const deptRow = (data.department || [])[0];
      const newDept = { name: deptRow ? String(deptRow.name || "") : "" };

      const newPrograms = (data.programs || []).map(r => ({
        id: String(r.id || uid()), name: String(r.name || ""), type: r.type || "UG4",
        major: String(r.major || ""), minor: String(r.minor || ""),
        totalTarget: parseFloat(r.totalTarget) || 0, semMin: parseFloat(r.semMin) || 20, semMax: parseFloat(r.semMax) || 22,
        semesters: parseInt(r.semesters, 10) || semestersForType(r.type || "UG4"), courses: []
      }));
      const idMap = {};
      newPrograms.forEach(p => { idMap[p.id] = p; idMap["name:" + p.name] = p; });

      const newFaculty = (data.faculty || []).map(r => ({
        id: String(r.id || uid()), name: String(r.name || ""), designation: String(r.designation || ""),
        specialization: String(r.specialization || ""), maxLoad: parseFloat(r.maxLoad) || 16
      }));
      const facIdMap = {};
      newFaculty.forEach(f => { facIdMap[f.id] = f; facIdMap["name:" + f.name] = f; });
      function resolveFaculty(id, name) {
        if (id && facIdMap[String(id)]) return facIdMap[String(id)].id;
        if (name && facIdMap["name:" + name]) return facIdMap["name:" + name].id;
        return "";
      }

      const courseIdMap = {};
      (data.courses || []).forEach(r => {
        const prog = (r.programId && idMap[String(r.programId)]) || (r.programName && idMap["name:" + r.programName]);
        if (!prog) return; // skip orphan rows
        const course = {
          id: String(r.id || uid()), sem: parseInt(r.sem, 10) || 1, code: String(r.code || ""), title: String(r.title || ""),
          category: String(r.category || ""), L: parseFloat(r.L) || 0, T: parseFloat(r.T) || 0, P: parseFloat(r.P) || 0,
          credits: parseFloat(r.credits) || 0, assignments: []
        };
        prog.courses.push(course);
        courseIdMap[course.id] = course;
        courseIdMap["key:" + prog.id + "|" + course.sem + "|" + course.code] = course;
      });

      (data.assignments || []).forEach(r => {
        let course = r.courseId && courseIdMap[String(r.courseId)];
        if (!course && r.programName && r.sem && r.code) {
          const prog = idMap["name:" + r.programName];
          if (prog) course = courseIdMap["key:" + prog.id + "|" + parseInt(r.sem, 10) + "|" + r.code];
        }
        if (!course) return;
        const facultyId = resolveFaculty(r.facultyId, r.facultyName);
        if (!facultyId) return;
        course.assignments.push({ id: String(r.id || uid()), facultyId, hours: parseFloat(r.hours) || 0 });
      });

      const newTimetable = [];
      (data.timetable || []).forEach(r => {
        const prog = (r.programId && idMap[String(r.programId)]) || (r.programName && idMap["name:" + r.programName]);
        if (!prog) return;
        let course = r.courseId && courseIdMap[String(r.courseId)];
        if (!course && r.code) course = courseIdMap["key:" + prog.id + "|" + parseInt(r.semester, 10) + "|" + r.code];
        if (!course) return;
        newTimetable.push({
          id: String(r.id || uid()), programId: prog.id, semester: parseInt(r.semester, 10) || 1, division: String(r.division || "A"),
          day: String(r.day || "Mon"), period: parseInt(r.period, 10) || 1, courseId: course.id, code: course.code,
          facultyId: resolveFaculty(r.facultyId, r.facultyName), room: String(r.room || "")
        });
      });

      return { department: newDept, programs: newPrograms, faculty: newFaculty, timetable: newTimetable };
    }

    function bindDeptSetup() {
      const f1 = document.getElementById("f-dept");
      if (f1) f1.addEventListener("submit", async e => {
        e.preventDefault();

      if (selType) { selType.addEventListener("change", syncTypeUI); syncTypeUI(); }

      if (f2) f2.addEventListener("submit", async e => {
        e.preventDefault();
        const fd = new FormData(f2);

        prog.name = fd.get("name"); prog.major = fd.get("major"); prog.minor = fd.get("minor");
        prog.totalTarget = parseInt(fd.get("totalTarget"), 10) || prog.totalTarget;
        prog.semMin = parseInt(fd.get("semMin"), 10); prog.semMax = parseInt(fd.get("semMax"), 10);
        PROGRAMS.push(prog);
        if (!ACTIVE_PROGRAM_ID) { ACTIVE_PROGRAM_ID = prog.id; LOAD_PROGRAM_ID = prog.id; TT_PROGRAM_ID = prog.id; EXPORT_PROGRAM_ID = prog.id; }
        await saveProject();
        render();
      });
    }

    /* ============================= PROGRAM SELECTOR (shared widget) ============================= */
    function programSelector(selectedId, onChangeAttr) {
      if (PROGRAMS.length === 0) return "";
      return `<div class="field"><label>Programme</label>
    <select id="${onChangeAttr}">${PROGRAMS.map(p => `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>${esc(p.name) || '(untitled)'}</option>`).join("")}</select>
  </div>`;
    }

    /* ============================= CURRICULUM BUILDER ============================= */
    function semesterCourses(prog, sem) { return prog.courses.filter(c => c.sem === sem); }
    function semesterTotal(prog, sem) { return semesterCourses(prog, sem).reduce((s, c) => s + (parseFloat(c.credits) || 0), 0); }

    function pageBuilder() {
      if (PROGRAMS.length === 0) return pageHeader("Curriculum · 01", "Curriculum Builder", "") + noProgramsEmpty();
      const prog = getProgram(ACTIVE_PROGRAM_ID) || PROGRAMS[0];
      ACTIVE_PROGRAM_ID = prog.id;
      if (ACTIVE_SEM > prog.semesters) ACTIVE_SEM = 1;
      const sc = semesterCourses(prog, ACTIVE_SEM);
      const total = semesterTotal(prog, ACTIVE_SEM);
      const status = total === 0 ? null : (total < prog.semMin || total > prog.semMax ? "warn" : "ok");
      return `
    ${pageHeader("Curriculum · 01", "Curriculum Builder", "Add courses to each semester of the selected programme, tagged by NEP category.")}
    <div class="selectbar">${programSelector(prog.id, "sel-builder-prog")}<span class="tag ${prog.type !== 'UG4' ? 'purple' : ''}" style="align-self:center;">${PROGRAM_TYPES[prog.type].label}</span></div>
    <div class="sem-tabs">
      ${semRange(prog.semesters).map(s => { const t = semesterTotal(prog, s); return `<button class="sem-tab ${ACTIVE_SEM === s ? 'active' : ''}" data-sem="${s}">SEM ${toRoman(s)}<span class="c">${t || 0} Cr.</span></button>`; }).join("")}
    </div>
    <div class="card tick">
      <h3>Semester ${toRoman(ACTIVE_SEM)} ${status ? `<span class="status ${status}" style="margin-left:8px;">${status === 'ok' ? '✓ IN RANGE' : '⚠ CHECK RANGE'}</span>` : ''}</h3>
      <p class="desc">Target ${prog.semMin}–${prog.semMax} credits per semester.</p>
      ${sc.length === 0 ? `<div class="empty">No courses added yet for this semester.</div>` : `
      <table>
        <thead><tr><th style="width:13%">Code</th><th>Title</th><th style="width:15%">Category</th><th style="width:7%">L</th><th style="width:7%">T</th><th style="width:7%">P</th><th style="width:9%">Credits</th><th style="width:6%"></th></tr></thead>
        <tbody>${sc.map(c => `<tr>
          <td style="font-family:'IBM Plex Mono',monospace;">${esc(c.code)}</td><td>${esc(c.title)}</td><td><span class="tag">${c.category}</span></td>
          <td>${c.L || 0}</td><td>${c.T || 0}</td><td>${c.P || 0}</td>
          <td style="font-family:'IBM Plex Mono',monospace; font-weight:700;">${c.credits}</td>
          <td><button class="danger" data-id="${c.id}">✕</button></td></tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="6">Semester total</td><td colspan="2">${total} Cr.</td></tr></tfoot>
      </table>`}
      <form id="f-add-course" class="add-row">
        <div class="field"><label>Code</label><input type="text" name="code" placeholder="PCC-301" required></div>
        <div class="field"><label>Title</label><input type="text" name="title" placeholder="Data Structures" required></div>
        <div class="field"><label>Category</label><select name="category" required>${categoriesForType(prog.type).map(c => `<option value="${c.code}">${c.code} — ${c.name}</option>`).join("")}</select></div>
        <div class="field"><label>L</label><input type="number" name="L" min="0" value="0"></div>
        <div class="field"><label>T</label><input type="number" name="T" min="0" value="0"></div>
        <div class="field"><label>P</label><input type="number" name="P" min="0" value="0"></div>
        <div class="field"><label>Credits</label><input type="number" step="0.5" name="credits" min="0" required></div>
        <button class="primary" type="submit">Add</button>
      </form>
    </div>
  `;
    }
    function bindBuilder() {
      const sel = document.getElementById("sel-builder-prog");
      if (sel) sel.addEventListener("change", () => { ACTIVE_PROGRAM_ID = sel.value; ACTIVE_SEM = 1; render(); });
      document.querySelectorAll(".sem-tab").forEach(b => b.addEventListener("click", () => { ACTIVE_SEM = parseInt(b.dataset.sem, 10); render(); }));
      document.querySelectorAll("main .danger").forEach(b => {
        b.addEventListener("click", async () => {
          const prog = getProgram(ACTIVE_PROGRAM_ID);
          prog.courses = prog.courses.filter(c => c.id !== b.dataset.id);
          TIMETABLE = TIMETABLE.filter(t => t.courseId !== b.dataset.id);
          await saveProject(); render();
        });
      });
      const f = document.getElementById("f-add-course");
      if (f) f.addEventListener("submit", async e => {
        e.preventDefault();
        const fd = new FormData(f);
        const prog = getProgram(ACTIVE_PROGRAM_ID);
        prog.courses.push({
          id: uid(), sem: ACTIVE_SEM, code: fd.get("code"), title: fd.get("title"), category: fd.get("category"),
          L: parseFloat(fd.get("L")) || 0, T: parseFloat(fd.get("T")) || 0, P: parseFloat(fd.get("P")) || 0,
          credits: parseFloat(fd.get("credits")) || 0, assignments: []
        });

    /* ============================= VALIDATION ============================= */
    function categoryTotal(prog, code) { return prog.courses.filter(c => c.category === code).reduce((s, c) => s + (parseFloat(c.credits) || 0), 0); }
    function grandTotal(prog) { return prog.courses.reduce((s, c) => s + (parseFloat(c.credits) || 0), 0); }

    function pageValidation() {
      if (PROGRAMS.length === 0) return pageHeader("Curriculum · 02", "Validation Dashboard", "") + noProgramsEmpty();
      const prog = getProgram(ACTIVE_PROGRAM_ID) || PROGRAMS[0];
      ACTIVE_PROGRAM_ID = prog.id;
      const gt = grandTotal(prog);
      const typeMeta = PROGRAM_TYPES[prog.type];
      const targetLow = prog.totalTarget;
      const targetHigh = prog.type === "UG4" ? (prog.totalTarget <= 176 ? 176 : 194) : typeMeta.rangeHigh;
      const overallStatus = gt === 0 ? null : (gt < targetLow ? "bad" : gt > targetHigh ? "warn" : "ok");
      const coreCode = prog.type === "UG4" ? "PCC" : "PCC_PG";
      const elecCode = prog.type === "UG4" ? "PEC" : "PEC_PG";
      const majorCredits = categoryTotal(prog, coreCode) + categoryTotal(prog, elecCode);
      const majorPct = gt > 0 ? Math.round(majorCredits / gt * 100) : 0;
      return `
    ${pageHeader("Curriculum · 02", "Validation Dashboard", "Live comparison of the selected programme against the Maharashtra NEP 2020 credit framework.")}
    <div class="selectbar">${programSelector(prog.id, "sel-val-prog")}<span class="tag ${prog.type !== 'UG4' ? 'purple' : ''}" style="align-self:center;">${typeMeta.label}</span></div>
    <div class="grid4">
      <div class="stat"><div class="n">${gt}</div><div class="l">Total credits designed</div><div class="meter ${overallStatus === 'bad' ? 'bad' : overallStatus === 'warn' ? 'warn' : ''}"><div style="width:${Math.min(100, gt / targetHigh * 100)}%"></div></div></div>
      <div class="stat"><div class="n">${targetLow}–${targetHigh}</div><div class="l">Target range (Cr.)</div></div>
      <div class="stat"><div class="n">${majorPct}%</div><div class="l">Major-discipline share</div><div class="meter ${majorPct < 50 ? 'bad' : ''}"><div style="width:${Math.min(100, majorPct)}%"></div></div></div>
      <div class="stat"><div class="n">${prog.courses.length}</div><div class="l">Courses entered</div></div>
    </div>
    <div class="card tick"><h3>Per-semester credit load</h3>
      <table><thead><tr><th>Semester</th><th>Credits</th><th>Target</th><th>Status</th></tr></thead>
        <tbody>${semRange(prog.semesters).map(s => {
        const t = semesterTotal(prog, s); const st = t === 0 ? null : (t < prog.semMin || t > prog.semMax ? "warn" : "ok");
        return `<tr><td>Sem ${toRoman(s)}</td><td style="font-family:'IBM Plex Mono',monospace;">${t}</td><td style="font-family:'IBM Plex Mono',monospace; color:var(--ink-soft);">${prog.semMin}–${prog.semMax}</td><td>${st ? `<span class="status ${st}">${st === 'ok' ? '✓ OK' : '⚠ CHECK'}</span>` : `<span class="status warn">— empty</span>`}</td></tr>`;
      }).join("")}</tbody>
      </table>
    </div>
    <div class="card tick"><h3>Category-wise credit allocation</h3>
      <table><thead><tr><th>Code</th><th>Category</th><th>Designed</th><th>Target</th><th>Status</th></tr></thead>
        <tbody>${categoriesForType(prog.type).map(cat => {
        const t = categoryTotal(prog, cat.code); const st = t === 0 ? null : (t < cat.min ? "bad" : t > cat.max ? "warn" : "ok");
        return `<tr><td><span class="tag">${cat.code}</span></td><td>${cat.name}</td><td style="font-family:'IBM Plex Mono',monospace; font-weight:700;">${t}</td><td style="font-family:'IBM Plex Mono',monospace; color:var(--ink-soft);">${cat.min === cat.max ? cat.min : cat.min + '–' + cat.max}</td><td>${st ? `<span class="status ${st}">${st === 'ok' ? '✓ OK' : st === 'bad' ? '⚠ UNDER' : '⚠ OVER'}</span>` : `<span class="status warn">— none yet</span>`}</td></tr>`;
      }).join("")}</tbody>
      </table>
    </div>
  `;
    }
    function bindValidation() {
      const sel = document.getElementById("sel-val-prog");
      if (sel) sel.addEventListener("change", () => { ACTIVE_PROGRAM_ID = sel.value; render(); });
    }

    /* ============================= FACULTY DIRECTORY ============================= */
    function pageFaculty() {
      return `
    ${pageHeader("Faculty Load · 01", "Faculty Directory", "Add every faculty member in the department, with their maximum weekly teaching-hour load.")}
    <div class="card tick">
      <h3>Faculty <span class="tag" style="margin-left:6px;">${FACULTY.length}</span></h3>
      ${FACULTY.length === 0 ? `<div class="empty">No faculty added yet.</div>` : `
      <table><thead><tr><th>Name</th><th>Designation</th><th>Specialisation</th><th>Max load/week</th><th></th></tr></thead>
        <tbody>${FACULTY.map(f => `<tr><td><strong>${esc(f.name)}</strong></td><td>${esc(f.designation) || '—'}</td><td>${esc(f.specialization) || '—'}</td><td style="font-family:'IBM Plex Mono',monospace;">${f.maxLoad} hrs</td><td><button class="danger" data-id="${f.id}">Delete</button></td></tr>`).join("")}</tbody>
      </table>`}
      <form id="f-add-faculty" class="add-row" style="grid-template-columns:1.3fr 1.1fr 1.3fr .8fr auto;">
        <div class="field"><label>Name</label><input type="text" name="name" placeholder="Dr. A. B. Patil" required></div>
        <div class="field"><label>Designation</label><input type="text" name="designation" placeholder="Assistant Professor"></div>
        <div class="field"><label>Specialisation</label><input type="text" name="specialization" placeholder="Data Structures, DBMS"></div>
        <div class="field"><label>Max load (hrs/wk)</label><input type="number" name="maxLoad" value="16" min="1" max="30"></div>
        <button class="primary" type="submit">Add faculty</button>
      </form>
    </div>
  `;
    }
    function bindFaculty() {
      document.querySelectorAll("main .danger").forEach(b => {
        b.addEventListener("click", async () => {
          if (!confirm("Delete this faculty member? Their assignments will also be removed.")) return;
          FACULTY = FACULTY.filter(f => f.id !== b.dataset.id);
          PROGRAMS.forEach(p => p.courses.forEach(c => { c.assignments = (c.assignments || []).filter(a => a.facultyId !== b.dataset.id); }));

        e.preventDefault();
        const fd = new FormData(f);
        FACULTY.push({ id: uid(), name: fd.get("name"), designation: fd.get("designation"), specialization: fd.get("specialization"), maxLoad: parseFloat(fd.get("maxLoad")) || 16 });

    /* ============================= LOAD DISTRIBUTION ============================= */
    function courseHours(c) { return (parseFloat(c.L) || 0) + (parseFloat(c.T) || 0) + (parseFloat(c.P) || 0); }
    function assignedHours(c) { return (c.assignments || []).reduce((s, a) => s + (parseFloat(a.hours) || 0), 0); }

    function pageLoadDist() {
      if (PROGRAMS.length === 0) return pageHeader("Faculty Load · 02", "Load Distribution", "") + noProgramsEmpty();
      if (FACULTY.length === 0) return pageHeader("Faculty Load · 02", "Load Distribution", "") + `<div class="empty">Add faculty in the Faculty Directory first.</div>`;
      const prog = getProgram(LOAD_PROGRAM_ID) || PROGRAMS[0];
      LOAD_PROGRAM_ID = prog.id;
      if (LOAD_SEM > prog.semesters) LOAD_SEM = 1;
      const sc = semesterCourses(prog, LOAD_SEM);
      return `
    ${pageHeader("Faculty Load · 02", "Load Distribution", "Assign faculty to each course. Weekly hours default to the course's L+T+P; split across two teachers for lab batches if needed.")}
    <div class="selectbar">
      ${programSelector(prog.id, "sel-load-prog")}
      <div class="field"><label>Semester</label><select id="sel-load-sem">${semRange(prog.semesters).map(s => `<option value="${s}" ${s === LOAD_SEM ? 'selected' : ''}>Sem ${toRoman(s)}</option>`).join("")}</select></div>
    </div>
    ${sc.length === 0 ? `<div class="empty">No courses in Sem ${toRoman(LOAD_SEM)} of this programme yet.</div>` : sc.map(c => {
        const total = courseHours(c); const assigned = assignedHours(c);
        const st = assigned === 0 ? "bad" : assigned < total ? "warn" : assigned > total ? "warn" : "ok";
        return `
      <div class="card tick" data-course="${c.id}">
        <h3>${esc(c.code)} — ${esc(c.title)} <span class="tag" style="margin-left:6px;">${c.category}</span>
          <span class="status ${st}" style="margin-left:8px;">${assigned}/${total} hrs ${st === 'ok' ? '✓' : '⚠'}</span>
        </h3>
        <div>${(c.assignments || []).map(a => `<span class="chip">${esc(facultyName(a.facultyId))} — ${a.hours} hrs<button class="chip-x" data-course="${c.id}" data-fac="${a.facultyId}">✕</button></span>`).join("") || `<span style="color:var(--ink-soft); font-size:12.5px;">No faculty assigned yet.</span>`}</div>
        <form class="f-assign add-row" data-course="${c.id}" style="grid-template-columns:2fr 1fr auto;">
          <div class="field"><label>Faculty</label><select name="facultyId" required>${FACULTY.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("")}</select></div>
          <div class="field"><label>Hours/week</label><input type="number" step="0.5" name="hours" value="${Math.max(0, total - assigned) || total}" min="0"></div>
          <button class="primary" type="submit">Assign</button>
        </form>
      </div>`;
      }).join("")}
  `;
    }
    function bindLoadDist() {
      const selP = document.getElementById("sel-load-prog");
      if (selP) selP.addEventListener("change", () => { LOAD_PROGRAM_ID = selP.value; LOAD_SEM = 1; render(); });
      const selS = document.getElementById("sel-load-sem");
      if (selS) selS.addEventListener("change", () => { LOAD_SEM = parseInt(selS.value, 10); render(); });
      document.querySelectorAll(".chip-x").forEach(b => {
        b.addEventListener("click", async () => {
          const prog = getProgram(LOAD_PROGRAM_ID);
          const c = prog.courses.find(c => c.id === b.dataset.course);
          c.assignments = (c.assignments || []).filter(a => a.facultyId !== b.dataset.fac);
          await saveProject(); render();
        });
      });
      document.querySelectorAll(".f-assign").forEach(f => {
        f.addEventListener("submit", async e => {
          e.preventDefault();
          const fd = new FormData(f);
          const prog = getProgram(LOAD_PROGRAM_ID);
          const c = prog.courses.find(c => c.id === f.dataset.course);
          c.assignments = c.assignments || [];
          const facultyId = fd.get("facultyId");
          const existing = c.assignments.find(a => a.facultyId === facultyId);
          if (existing) existing.hours = parseFloat(fd.get("hours")) || 0;
          else c.assignments.push({ id: uid(), facultyId, hours: parseFloat(fd.get("hours")) || 0 });
          await saveProject(); render();
        });
      });
    }

    /* ============================= LOAD SUMMARY ============================= */
    function facultyTotalLoad(facId) {
      let total = 0; const courses = [];
      PROGRAMS.forEach(p => p.courses.forEach(c => {
        (c.assignments || []).forEach(a => {
          if (a.facultyId === facId) { total += parseFloat(a.hours) || 0; courses.push({ prog: p.name, sem: c.sem, code: c.code, title: c.title, hours: a.hours }); }
        });
      }));
      return { total, courses };
    }
    function pageLoadSummary() {
      if (FACULTY.length === 0) return pageHeader("Faculty Load · 03", "Load Summary", "") + `<div class="empty">Add faculty in the Faculty Directory first.</div>`;
      return `
    ${pageHeader("Faculty Load · 03", "Load Summary", "Total weekly teaching hours per faculty member, across every programme and semester.")}
    ${FACULTY.map(f => {
        const { total, courses } = facultyTotalLoad(f.id);
        const st = total === 0 ? null : total > f.maxLoad ? "bad" : total === f.maxLoad ? "ok" : "warn";
        return `
      <div class="card tick">
        <h3>${esc(f.name)} <span style="color:var(--ink-soft); font-weight:400; font-size:13px;">— ${esc(f.designation) || ''}</span>
          <span class="status ${st || 'warn'}" style="margin-left:8px;">${total}/${f.maxLoad} hrs ${st === 'bad' ? '⚠ OVERLOADED' : st === 'ok' ? '✓ AT CAPACITY' : st === 'warn' ? '· under capacity' : '— unassigned'}</span>
        </h3>
        <div class="meter ${st === 'bad' ? 'bad' : st === 'warn' ? 'warn' : ''}"><div style="width:${Math.min(100, total / f.maxLoad * 100)}%"></div></div>
        ${courses.length === 0 ? `<p class="desc" style="margin-top:10px;">No courses assigned.</p>` : `
        <table style="margin-top:12px;"><thead><tr><th>Programme</th><th>Sem</th><th>Course</th><th>Hrs/wk</th></tr></thead>
          <tbody>${courses.map(c => `<tr><td>${esc(c.prog)}</td><td>${toRoman(c.sem)}</td><td>${esc(c.code)} — ${esc(c.title)}</td><td style="font-family:'IBM Plex Mono',monospace;">${c.hours}</td></tr>`).join("")}</tbody>
        </table>`}
      </div>`;
      }).join("")}
  `;
    }

    /* ============================= TIMETABLE ============================= */
    function ttEntriesFor(progId, sem, div) { return TIMETABLE.filter(t => t.programId === progId && t.semester === sem && t.division === div); }
    function ttFindCell(progId, sem, div, day, period) { return TIMETABLE.find(t => t.programId === progId && t.semester === sem && t.division === div && t.day === day && t.period === period); }
    function ttClashesFor(entry) {
      if (!entry) return [];
      return TIMETABLE.filter(t => t.id !== entry.id && t.day === entry.day && t.period === entry.period &&
        ((entry.facultyId && t.facultyId === entry.facultyId) || (entry.room && t.room && t.room === entry.room)));
    }

    function pageTimetable() {
      if (PROGRAMS.length === 0) return pageHeader("Timetable · 01", "Timetable Builder", "") + noProgramsEmpty();
      const prog = getProgram(TT_PROGRAM_ID) || PROGRAMS[0];
      TT_PROGRAM_ID = prog.id;
      if (TT_SEM > prog.semesters) TT_SEM = 1;
      const courses = semesterCourses(prog, TT_SEM);
      const selectedEntry = TT_SELECTED ? ttFindCell(prog.id, TT_SEM, TT_DIVISION, TT_SELECTED.day, TT_SELECTED.period) : null;
      return `

    function bindTimetable() {

          id: existing ? existing.id : uid(), programId: prog.id, semester: TT_SEM, division: TT_DIVISION,

    /* ============================= CLASH REPORT ============================= */
    function pageClash() {
      const seen = new Set(); const clashes = [];
      TIMETABLE.forEach(t => {
        ttClashesFor(t).forEach(o => {
          const key = [t.id, o.id].sort().join("|");
          if (!seen.has(key)) { seen.add(key); clashes.push([t, o]); }
        });
      });
      return `
    ${pageHeader("Timetable · 02", "Clash Report", "Every pair of timetable slots sharing the same day and period with the same faculty or room.")}
    ${clashes.length === 0 ? `<div class="empty">No clashes detected across the current timetable(s).</div>` : `
    <div class="card tick">
      <table>
        <thead><tr><th>Day / Period</th><th>Slot A</th><th>Slot B</th><th>Conflict</th></tr></thead>
        <tbody>${clashes.map(([a, b]) => {
        const progA = getProgram(a.programId), progB = getProgram(b.programId);
        const perLbl = PERIODS.find(p => p.id === a.period);
        const conflictType = a.facultyId && a.facultyId === b.facultyId ? "Faculty" : "Room";
        return `<tr>
            <td>${a.day} · ${perLbl.label}</td>
            <td>${esc(progA ? progA.name : '')} Sem ${toRoman(a.semester)}-${esc(a.division)} · ${esc(a.code)}</td>
            <td>${esc(progB ? progB.name : '')} Sem ${toRoman(b.semester)}-${esc(b.division)} · ${esc(b.code)}</td>
            <td><span class="status bad">${conflictType}</span></td>
          </tr>`;
      }).join("")}</tbody>
      </table>
    </div>`}
  `;
    }

    function buildWorkbook() {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ Name: DEPARTMENT.name || "" }]), "Department");

      const programRows = PROGRAMS.map(p => ({
        id: p.id, name: p.name, type: p.type, major: p.major, minor: p.minor,
        totalTarget: p.totalTarget, semMin: p.semMin, semMax: p.semMax, semesters: p.semesters
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(programRows), "Programs");

      const courseRows = [];
      const assignRows = [];
      PROGRAMS.forEach(p => p.courses.forEach(c => {
        courseRows.push({ id: c.id, programId: p.id, programName: p.name, sem: c.sem, code: c.code, title: c.title, category: c.category, L: c.L, T: c.T, P: c.P, credits: c.credits });
        (c.assignments || []).forEach(a => {
          assignRows.push({ courseId: c.id, programName: p.name, sem: c.sem, code: c.code, facultyId: a.facultyId, facultyName: facultyName(a.facultyId), hours: a.hours });
        });
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(courseRows), "Courses");

      const facultyRows = FACULTY.map(f => ({ id: f.id, name: f.name, designation: f.designation, specialization: f.specialization, maxLoad: f.maxLoad }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(facultyRows), "Faculty");

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assignRows), "Assignments");

      const ttRows = TIMETABLE.map(t => {
        const p = getProgram(t.programId);
        return { id: t.id, programId: t.programId, programName: p ? p.name : "", semester: t.semester, division: t.division, day: t.day, period: t.period, courseId: t.courseId, code: t.code, facultyId: t.facultyId, facultyName: facultyName(t.facultyId), room: t.room };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ttRows), "Timetable");

      return wb;
    }
    function downloadWorkbook(wb, filename) {
      XLSX.writeFile(wb, filename);
    }
    function sheetRows(wb, name) {
      const ws = wb.Sheets[name];
      return ws ? XLSX.utils.sheet_to_json(ws, { defval: "" }) : [];
    }
    async function importWorkbook(file) {
      const status = document.getElementById("xl-status");
      const setStatus = (msg, ok) => { if (status) { status.style.display = "block"; status.style.color = ok ? "var(--green)" : "var(--red)"; status.textContent = msg; } };
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });

        const deptRows = sheetRows(wb, "Department");
        const newDept = { name: deptRows[0] ? String(deptRows[0].Name || "") : "" };

        const progRows = sheetRows(wb, "Programs");
        if (progRows.length === 0) throw new Error("No rows found in the 'Programs' sheet.");
        const idMap = {}; // old/sheet id -> program object
        const newPrograms = progRows.map(r => {
          const type = PROGRAM_TYPES[r.type] ? r.type : "UG4";
          const p = {
            id: String(r.id || uid()), name: String(r.name || ""), type,
            major: String(r.major || ""), minor: String(r.minor || ""),
            totalTarget: parseInt(r.totalTarget, 10) || PROGRAM_TYPES[type].rangeLow,
            semMin: parseInt(r.semMin, 10) || 20, semMax: parseInt(r.semMax, 10) || 22,
            semesters: parseInt(r.semesters, 10) || semestersForType(type),
            courses: []
          };
          idMap[p.id] = p;
          if (r.name) idMap["name:" + r.name] = p; // fallback lookup by name
          return p;
        });

        const facRows = sheetRows(wb, "Faculty");
        const facIdMap = {};
        const newFaculty = facRows.map(r => {
          const f = { id: String(r.id || uid()), name: String(r.name || ""), designation: String(r.designation || ""), specialization: String(r.specialization || ""), maxLoad: parseFloat(r.maxLoad) || 16 };
          facIdMap[f.id] = f;
          if (f.name) facIdMap["name:" + f.name] = f;
          return f;
        });
        function resolveFaculty(id, name) {
          if (id && facIdMap[String(id)]) return facIdMap[String(id)].id;
          if (name && facIdMap["name:" + name]) return facIdMap["name:" + name].id;
          return "";
        }

        const courseRows = sheetRows(wb, "Courses");
        const courseIdMap = {};
        courseRows.forEach(r => {
          let prog = (r.programId && idMap[String(r.programId)]) || (r.programName && idMap["name:" + r.programName]);
          if (!prog) return; // skip orphan rows
          const course = {
            id: String(r.id || uid()), sem: parseInt(r.sem, 10) || 1, code: String(r.code || ""), title: String(r.title || ""),
            category: String(r.category || ""), L: parseFloat(r.L) || 0, T: parseFloat(r.T) || 0, P: parseFloat(r.P) || 0,
            credits: parseFloat(r.credits) || 0, assignments: []
          };
          prog.courses.push(course);
          courseIdMap[course.id] = course;
          courseIdMap["key:" + prog.id + "|" + course.sem + "|" + course.code] = course;
        });

        const assignRows = sheetRows(wb, "Assignments");
        assignRows.forEach(r => {
          let course = r.courseId && courseIdMap[String(r.courseId)];
          if (!course && r.programName && r.sem && r.code) {
            const prog = idMap["name:" + r.programName];
            if (prog) course = courseIdMap["key:" + prog.id + "|" + parseInt(r.sem, 10) + "|" + r.code];
          }
          if (!course) return;
          const facultyId = resolveFaculty(r.facultyId, r.facultyName);
          if (!facultyId) return;
          course.assignments.push({ facultyId, hours: parseFloat(r.hours) || 0 });
        });

        const ttRows = sheetRows(wb, "Timetable");
        const newTimetable = [];
        ttRows.forEach(r => {
          let prog = (r.programId && idMap[String(r.programId)]) || (r.programName && idMap["name:" + r.programName]);
          if (!prog) return;
          let course = r.courseId && courseIdMap[String(r.courseId)];
          if (!course && r.code) course = courseIdMap["key:" + prog.id + "|" + parseInt(r.semester, 10) + "|" + r.code];
          if (!course) return;
          newTimetable.push({
            id: String(r.id || uid()), programId: prog.id, semester: parseInt(r.semester, 10) || 1, division: String(r.division || "A"),
            day: String(r.day || "Mon"), period: parseInt(r.period, 10) || 1, courseId: course.id, code: course.code,
            facultyId: resolveFaculty(r.facultyId, r.facultyName), room: String(r.room || "")
          });
        });

        DEPARTMENT = newDept; PROGRAMS = newPrograms; FACULTY = newFaculty; TIMETABLE = newTimetable;
        ACTIVE_PROGRAM_ID = PROGRAMS[0] ? PROGRAMS[0].id : null;
        LOAD_PROGRAM_ID = ACTIVE_PROGRAM_ID; TT_PROGRAM_ID = ACTIVE_PROGRAM_ID; EXPORT_PROGRAM_ID = ACTIVE_PROGRAM_ID;
        await saveProject();
        setStatus(`✓ Imported ${newPrograms.length} programme(s), ${courseRows.length} course(s), ${newFaculty.length} faculty, ${assignRows.length} assignment(s), ${newTimetable.length} timetable slot(s).`, true);
        render();
      } catch (err) {
        setStatus("⚠ Import failed: " + err.message, false);
      }
    }
    function bindExcel() {
      const btnExport = document.getElementById("btn-xl-export");
      if (btnExport) btnExport.addEventListener("click", () => {
        const wb = buildWorkbook();
        downloadWorkbook(wb, (DEPARTMENT.name || "department_academic_planner").replace(/[^a-z0-9]+/gi, "_") + ".xlsx");
      });
      const btnTemplate = document.getElementById("btn-xl-template");
      if (btnTemplate) btnTemplate.addEventListener("click", () => {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ Name: "Department of ..." }]), "Department");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ id: "", name: "", type: "UG4", major: "", minor: "", totalTarget: 160, semMin: 20, semMax: 22, semesters: 8 }]), "Programs");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ id: "", programId: "", programName: "", sem: 1, code: "", title: "", category: "", L: 0, T: 0, P: 0, credits: 0 }]), "Courses");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ id: "", name: "", designation: "", specialization: "", maxLoad: 16 }]), "Faculty");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ courseId: "", programName: "", sem: 1, code: "", facultyId: "", facultyName: "", hours: 0 }]), "Assignments");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{ id: "", programId: "", programName: "", semester: 1, division: "A", day: "Mon", period: 1, courseId: "", code: "", facultyId: "", facultyName: "", room: "" }]), "Timetable");
        downloadWorkbook(wb, "academic_planner_template.xlsx");
      });
      const btnImport = document.getElementById("btn-xl-import");
      if (btnImport) btnImport.addEventListener("click", () => {
        const fileInput = document.getElementById("inp-xl-file");
        if (!fileInput.files[0]) { alert("Choose a .xlsx file first."); return; }
        if (!confirm("This will replace everything currently in the planner with the contents of this workbook. Continue?")) return;
        importWorkbook(fileInput.files[0]);
      });
    }

    /* ============================= ROUTER ============================= */
    const PAGES = {
      "reference-framework": { render: pageReferenceFramework },
      "reference-pg": { render: pageReferencePG },
      "reference-grading": { render: pageReferenceGrading },
      "dept-setup": { render: pageDeptSetup, bind: bindDeptSetup },
      "builder": { render: pageBuilder, bind: bindBuilder },
      "validation": { render: pageValidation, bind: bindValidation },
      "faculty": { render: pageFaculty, bind: bindFaculty },
      "load-dist": { render: pageLoadDist, bind: bindLoadDist },
      "load-summary": { render: pageLoadSummary },
      "timetable": { render: pageTimetable, bind: bindTimetable },
      "clash": { render: pageClash },
      "export": { render: pageExport, bind: bindExport },
      "excel": { render: pageExcel, bind: bindExcel },
    };

    async function render() {
      if (!LOADED) await loadProject();
      renderNav();
      const page = PAGES[ROUTE] || PAGES["reference-framework"];
      const main = document.getElementById("main");
      main.innerHTML = page.render();
      if (page.bind) page.bind();
    }
    render();
  </script>
</body>
